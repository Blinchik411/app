packages:
  - apps/*
  - packages/*

# Каким зависимостям разрешено запускать postinstall-скрипты (pnpm 11+)
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false # телеметрия, не нужна
